<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080909">
  <meta name="color-scheme" content="dark">
  <title>Ink live simulation</title>
  <link rel="stylesheet" href="src/preview.css">
</head>
<body>
  <canvas class="fluid-canvas" id="fluid" aria-hidden="true"></canvas>
  <header class="preview-intro">
    <span class="preview-kicker">Live simulation</span>
    <p id="preview-status" role="status" aria-live="polite">Move inside the field to release ink.</p>
  </header>
  <fieldset class="preview-controls" aria-label="Live simulation controls">
    <legend>Shape the flow</legend>
    <label class="preview-range" for="preview-radius">
      <span>Brush radius</span><output id="preview-radius-value" for="preview-radius">0.40</output>
      <input id="preview-radius" type="range" min="0.10" max="0.80" step="0.05" value="0.40">
    </label>
    <label class="preview-range" for="preview-force">
      <span>Push force</span><output id="preview-force-value" for="preview-force">12000</output>
      <input id="preview-force" type="range" min="2000" max="20000" step="500" value="12000">
    </label>
    <label class="preview-range" for="preview-persistence">
      <span>Ink persistence</span><output id="preview-persistence-value" for="preview-persistence">4.50</output>
      <input id="preview-persistence" type="range" min="0" max="5" step="0.25" value="4.5">
    </label>
    <label class="preview-range" for="preview-bloom">
      <span>Glow</span><output id="preview-bloom-value" for="preview-bloom">0.30</output>
      <input id="preview-bloom" type="range" min="0" max="1.2" step="0.05" value="0.30">
    </label>
    <div class="preview-toggles" role="group" aria-label="Light effects">
      <button type="button" data-config="BLOOM" aria-pressed="true">Glow</button>
      <button type="button" data-config="SUNRAYS" aria-pressed="true">Sunrays</button>
    </div>
    <div class="preview-actions">
      <button type="button" data-action="burst">Add a burst</button>
      <button type="button" data-action="clear">Clear ink</button>
      <button type="button" data-action="pause" aria-pressed="false">Pause flow</button>
    </div>
  </fieldset>
  <script src="src/fluid.js" defer></script>
  <script src="src/preview.js" defer></script>
</body>
</html>
