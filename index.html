<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ink — fluid demo</title>
  <link rel="stylesheet" href="ink.css">
  <style>
    :root{--bg:#fdfcf7;--bg-soft:#f6f4ec;--ink:#23241f;--muted:#84867a;--line:#e2e0d4;--mono:ui-monospace,Menlo,monospace}
    html[data-theme="dark"]{--bg:#0a0a0a;--bg-soft:#111;--ink:#eaeaea;--muted:#8a8a8c;--line:#222}
    @media(prefers-color-scheme:dark){html:not([data-theme]){--bg:#0a0a0a;--bg-soft:#111;--ink:#eaeaea;--muted:#8a8a8c;--line:#222}}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);transition:background .3s,color .3s}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .topbar .brand{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
    .topbar .brand span{width:8px;height:8px;border-radius:50%;background:var(--ink);display:inline-block}
    .topbar .links{display:flex;align-items:center;gap:8px}
    .theme-toggle{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:none;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s,background .2s}
    .theme-toggle:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
    .theme-toggle svg{position:absolute;width:17px;height:17px;transition:opacity .35s,transform .5s cubic-bezier(.34,1.56,.64,1)}
    .theme-toggle .icon-sun{opacity:0;transform:rotate(-100deg) scale(.4)}html[data-theme="dark"] .theme-toggle .icon-moon{opacity:0;transform:rotate(100deg) scale(.4)}html[data-theme="dark"] .theme-toggle .icon-sun{opacity:1;transform:none}
    .gh-link{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;color:var(--muted);text-decoration:none;transition:color .2s,background .2s,transform .2s}
    .gh-link:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent);transform:translateY(-1px)}
    .gh-link svg{width:17px;height:17px}
    @media(max-width:560px){
      .topbar{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));gap:10px}
      .topbar .brand{font-size:.68rem}
      .theme-toggle,.gh-link{width:42px;height:42px;min-width:42px;min-height:42px}
      .theme-toggle svg,.gh-link svg{width:17px;height:17px}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand"><span></span> ink</span>
    <span class="links">
      <button id="toggle-theme" class="theme-toggle" aria-label="Toggle light/dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="gh-link" href="https://github.com/mkmlman/ink" aria-label="GitHub repository">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17 5.7 18 6 18 6c.6 1.6.2 2.8.1 3.1.8.9 1.2 1.9 1.2 3.2 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
      </a>
    </span>
  </div>
  <canvas class="fluid-canvas is-visible" id="fluid" aria-hidden="true"></canvas>
  <div class="fluid-dialers" id="fluid-dialers">
    <div class="dial" data-key="radius" data-min="0.10" data-max="0.80" data-step="0.05" data-value="0.40"><div class="dial-head"><span class="dial-label">Radius</span><span class="dial-value">0.40</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-radius" min="0.10" max="0.80" step="0.05" value="0.40"></div>
    <div class="dial" data-key="curl" data-min="0" data-max="8" data-step="0.5" data-value="4"><div class="dial-head"><span class="dial-label">Curl</span><span class="dial-value">4</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-curl" min="0" max="8" step="0.5" value="4"></div>
    <div class="dial" data-key="density" data-min="0" data-max="5" data-step="0.25" data-value="4"><div class="dial-head"><span class="dial-label">Density</span><span class="dial-value">4</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-density" min="0" max="5" step="0.25" value="4"></div>
    <div class="dial" data-key="pressureDiss" data-min="0" data-max="0.20" data-step="0.01" data-value="0.08"><div class="dial-head"><span class="dial-label">Press Diss</span><span class="dial-value">0.08</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-pressureDiss" min="0" max="0.20" step="0.01" value="0.08"></div>
    <div class="dial" data-key="velocity" data-min="0" data-max="1" data-step="0.05" data-value="0"><div class="dial-head"><span class="dial-label">Velocity</span><span class="dial-value">0</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-velocity" min="0" max="1" step="0.05" value="0"></div>
    <div class="dial" data-key="iterations" data-min="4" data-max="32" data-step="1" data-value="16"><div class="dial-head"><span class="dial-label">Iterations</span><span class="dial-value">16</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-iterations" min="4" max="32" step="1" value="16"></div>
    <div class="dial" data-key="splatForce" data-min="2000" data-max="20000" data-step="500" data-value="12000"><div class="dial-head"><span class="dial-label">Splat Force</span><span class="dial-value">12000</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-splatForce" min="2000" max="20000" step="500" value="12000"></div>
    <div class="dial" data-key="brightness" data-min="0" data-max="5" data-step="0.25" data-value="3"><div class="dial-head"><span class="dial-label">Brightness</span><span class="dial-value">3</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-brightness" min="0" max="5" step="0.25" value="3"></div>
    <div class="dial" data-key="idle" data-min="0" data-max="2" data-step="0.25" data-value="0"><div class="dial-head"><span class="dial-label">Idle</span><span class="dial-value">0</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-idle" min="0" max="2" step="0.25" value="0"></div>
    <div class="dial" data-key="bloom" data-min="0" data-max="1.2" data-step="0.05" data-value="0.30"><div class="dial-head"><span class="dial-label">Bloom</span><span class="dial-value">0.30</span></div><button class="dial-knob" tabindex="-1" aria-hidden="true" role="presentation"><span class="dial-knob-face"><span class="dial-indicator"></span></span></button><input type="range" id="dial-bloom" min="0" max="1.2" step="0.05" value="0.30"></div>
    <button class="dial-reset" id="dial-reset" type="button">↺ Reset</button>
  </div>
  <script src="fluid.js"></script>
  <script src="dials.js"></script>
  <script>
    // ensure visible by default in standalone demo
    window.addEventListener('load',()=>{ document.getElementById('fluid')?.classList.add('is-visible'); });
    // dark mode toggle (like ink) + github icon already in topbar
    (function(){
      var root=document.documentElement, key='ink-theme', btn=document.getElementById('toggle-theme');
      try{var s=localStorage.getItem(key); if(s==='light'||s==='dark') root.setAttribute('data-theme',s);}catch(e){}
      if(!root.getAttribute('data-theme')){
        var m=window.matchMedia('(prefers-color-scheme: dark)'); root.setAttribute('data-theme', m.matches?'dark':'light');
      }
      function syncPaper(){ document.dispatchEvent(new CustomEvent('themechange')); }
      if(btn) btn.addEventListener('click',function(){
        var cur=root.getAttribute('data-theme'), nxt=cur==='dark'?'light':'dark';
        root.setAttribute('data-theme',nxt);
        try{localStorage.setItem(key,nxt);}catch(e){}
        syncPaper();
      });
      syncPaper();
    })();
  </script>
</body>
</html>
